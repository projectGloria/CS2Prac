// NihilPrac.cfg: practice on the local CS2Prac server. Same basics as Nihil.cfg (binds, crosshair, viewmodel,
// HUD, audio); only the practice part differs. Online: exec Nihil. Practice: exec NihilPrac.

unbindall                                                                // Removes every existing key bind so only the binds below apply
name                                           Nihil                     // Sets your in-game player name

// ============================================
// CORE MOVEMENT & JUMP BINDS
// ============================================
bind "w"                                       "+forward"                // Hold to move forward
bind "a"                                       "+left"                   // Hold to strafe left
bind "s"                                       "+back"                   // Hold to move backward
bind "d"                                       "+right"                  // Hold to strafe right
bind "CTRL"                                    "+duck"                   // Crouch (hold or toggle, see option_duck_method)
bind "SHIFT"                                   "+sprint"                 // Walk, slower and quieter movement (hold or toggle, see option_speed_method)
bind "SPACE"                                   "+jump"                   // Jump

option_duck_method                             0                         // Crouch input method: 0 = hold to crouch, 1 = toggle
option_speed_method                            0                         // Walk input method: 0 = hold to walk, 1 = toggle

// ============================================
// WEAPON & UTILITY SELECTION BINDS
// ============================================
bind "1"                                       "slot1"                   // Select primary weapon (slot 1)
bind "2"                                       "slot2"                   // Select secondary weapon / pistol (slot 2)
bind "3"                                       "slot3"                   // Select knife (slot 3)
bind "4"                                       "slot6"                   // Select HE grenade (slot 6)
bind "5"                                       "slot5"                   // Select C4 bomb (slot 5, only while carrying it)
bind "z"                                       "slot7"                   // Select flashbang (slot 7)
bind "c"                                       "slot8"                   // Select smoke grenade (slot 8)
bind "j"                                       "slot9"                   // Select decoy grenade (slot 9)
bind "x"                                       "slot10"                  // Select molotov / incendiary grenade (slot 10)
bind "q"                                       "lastinv"                 // Switch back to the previously held weapon
bind "e"                                       "+use"                    // Use / interact: defuse, pick up items, open doors

// ============================================
// ACTION & INSPECT BINDS
// ============================================
bind "r"                                       "+reload"                 // Reload the current weapon
bind "f"                                       "+lookatweapon"           // Inspect the current weapon
bind "g"                                       "drop"                    // Drop the current weapon
bind "v"                                       "switchhands"             // Swap the viewmodel between left and right hand

// ============================================
// MOUSE & SENSITIVITY
// ============================================
bind "MOUSE1"                                  "+attack"                 // Primary fire
bind "MOUSE2"                                  "+attack2"                // Secondary fire (scope / alt fire / knife stab)
bind "MOUSE_X"                                 "yaw"                     // Mouse horizontal movement controls yaw (turning left/right)
bind "MOUSE_Y"                                 "pitch"                   // Mouse vertical movement controls pitch (looking up/down)

sensitivity                                    1                         // Mouse sensitivity multiplier
m_yaw                                          0.022                     // Degrees of horizontal view rotation per mouse count (0.022 = default)

// ============================================
// VIEWMODEL SETTINGS
// ============================================
viewmodel_fov                                  68                        // Field of view of the weapon viewmodel
viewmodel_offset_x                             2                         // Viewmodel horizontal (left/right) offset
viewmodel_offset_y                             2                         // Viewmodel forward/backward offset
viewmodel_offset_z                             -1                        // Viewmodel vertical (up/down) offset
viewmodel_presetpos                            0                         // Viewmodel preset: 0 = use the custom offsets above (1 = desktop, 2 = couch, 3 = classic)
cl_prefer_lefthanded                           true                      // Holds weapons in the left hand

// ============================================
// CROSSHAIR SETTINGS
// ============================================
crosshair                                      1                         // Master crosshair switch: 1 = show the crosshair
cl_show_observer_crosshair                     2                         // While spectating: 2 = show the observed player's crosshair for everyone

// Sniper Settings
cl_sniper_show_inaccuracy                      false                     // Hides the inaccuracy indicator on sniper scopes
cl_ironsight_usecrosshaircolor                 true                      // Scoped / iron-sight crosshair uses your custom crosshair color
cl_sniper_auto_rezoom                          1                         // Re-zooms the scope automatically after each sniper shot
cl_sniper_delay_unscope                        0                         // Sniper unscope-after-shot delay disabled (0)

cl_silencer_mode                               0                         // Silencer detaching: 0 = right click does NOT detach it (M4A1-S / USP-S), 1 = allowed

// ============================================
// CROSSHAIR SHAPE & COLOR SYSTEM
// ============================================
cl_crosshair_drawoutline                       1                         // Draws an outline around the crosshair (1 = on)
cl_crosshair_dynamic_maxdist_splitratio        0                         // Split-crosshair ratio of the maximum spread distance (0 = unused)
cl_crosshair_dynamic_splitalpha_innermod       0                         // Alpha multiplier of the inner crosshair lines when split (0 = invisible)
cl_crosshair_dynamic_splitalpha_outermod       1                         // Alpha multiplier of the outer crosshair lines when split (1 = fully visible)
cl_crosshair_dynamic_splitdist                 5                         // Spread distance at which the crosshair splits into inner/outer lines
cl_crosshair_dynamic_spread_limit              142                       // Maximum spread distance the dynamic crosshair may expand to
cl_crosshair_friendly_warning                  0                         // Crosshair color warning when aiming at a teammate (0 = off)
cl_crosshair_gap                               2                         // Gap between the crosshair center and its lines
cl_crosshair_length                            3                         // Length of each crosshair line
cl_crosshair_recoil                            false                     // Crosshair does not follow recoil (false = off)
cl_crosshair_sniper_width                      1                         // Width of the sniper scope crosshair lines
cl_crosshair_t                                 false                     // T-style crosshair (top line removed): false = off, full cross
cl_crosshair_thickness                         1                         // Thickness of the crosshair lines
cl_crosshaircolor_a                            255                       // Crosshair color: alpha / opacity (0-255)
cl_crosshaircolor_b                            0                         // Crosshair color: blue (0-255)
cl_crosshaircolor_g                            0                         // Crosshair color: green (0-255)
cl_crosshaircolor_r                            255                       // Crosshair color: red (0-255)
cl_crosshairdot                                false                     // Center dot of the crosshair (false = hidden)
cl_crosshairoutline_a                          159                       // Crosshair outline color: alpha / opacity (0-255)
cl_crosshairoutline_b                          0                         // Crosshair outline color: blue (0-255)
cl_crosshairoutline_g                          0                         // Crosshair outline color: green (0-255)
cl_crosshairoutline_r                          0                         // Crosshair outline color: red (0-255)
cl_crosshairstyle                              4                         // Crosshair style (4 = classic static)

// Crosshair Preset Toggle (Left Alt)
// crosshair_primary: applies the thin preset, then points crosshair_toggle at crosshair_secondary:
//   cl_crosshair_thickness 1  - line thickness 1
//   cl_crosshairstyle 4       - classic static style
//   alias crosshair_toggle crosshair_secondary - the next toggle press applies the secondary preset
alias "crosshair_primary"                      "cl_crosshair_thickness 1; cl_crosshairstyle 4; alias crosshair_toggle crosshair_secondary"
// crosshair_secondary: applies the thick preset, then points crosshair_toggle back at crosshair_primary:
//   cl_crosshair_thickness 3  - line thickness 3
//   cl_crosshairstyle 6       - classic static style (was 6, which is not a valid style: 0-5)
//   alias crosshair_toggle crosshair_primary - the next toggle press applies the primary preset
alias "crosshair_secondary"                    "cl_crosshair_thickness 3; cl_crosshairstyle 4; alias crosshair_toggle crosshair_primary"
alias "crosshair_toggle"                       "crosshair_secondary"     // Toggle entry point: starts by applying crosshair_secondary, then alternates
bind "ALT"                                     "crosshair_toggle"        // Left Alt toggles between the primary and secondary crosshair presets

// ============================================
// HUD & VISUAL SETTINGS
// ============================================
r_fullscreen_gamma                             3.5                       // Screen gamma, range 1.0-4.0, default 2.2 (lower = brighter, so 3.5 is darker than default)

// Toggle: 1 hides the HUD except crosshair and kill feed, 0 restores it
bind "h"                                       "toggle cl_draw_only_deathnotices 0 1"
hud_scaling                                    1                         // Overall HUD size (range 0.5-1.1, 1 = default)
safezonex                                      1                         // Horizontal HUD safe zone (1 = HUD uses the full screen width)
safezoney                                      1                         // Vertical HUD safe zone (1 = HUD uses the full screen height)
cl_hud_color                                   6                         // HUD color preset (6 = orange)
cl_showloadout                                 1                         // Shows the weapon loadout in the buy menu (1 = on)
cl_weapon_selection_rarity_color               true                      // Weapon selection panel uses item rarity colors

hud_showtargetid                               1                         // Shows the name of the player under your crosshair (enemy names in red)
cl_teamcounter_playercount_instead_of_avatars  false                     // Top team counter: false = show player avatars, true = show alive-count numbers
cl_allow_animated_avatars                      0                         // Animated Steam avatars disabled (0)
cl_hide_avatar_images                          0                         // Avatar images: 0 = show everyone's (2 = friends only)
cl_show_equipped_character_for_player_avatars  0                         // Avatars show the Steam profile picture, not the equipped agent model (0)

// ============================================
// TEAMMATE & RADAR SETTINGS
// ============================================
cl_teamid_overhead_mode                        3                         // Teammate overhead info mode 3: pips, name, health and equipment icons, visible through walls
cl_teammate_colors_show                        1                         // Unique teammate colors on radar and scoreboard (0 = off, 1 = on, 2 = letters)

cl_radar_always_centered                       1                         // Radar stays centered on your player
cl_radar_icon_scale_min                        0.5                       // Minimum size of icons on the radar
cl_radar_rotate                                1                         // Radar rotates with your view direction
cl_radar_scale                                 0.3                       // Radar zoom level (0.3 = default here, the mouse-wheel binds below switch it to 0.5)
cl_radar_square_with_scoreboard                0                         // Radar shape while the scoreboard is open (0 = unchanged / not square)
cl_hud_radar_scale                             1.2                       // Size multiplier of the HUD radar
cl_hud_radar_blur_background                   false                     // Blur behind the radar background (false = off)
cl_hud_radar_background_alpha                  1                         // Radar background opacity (1 = fully opaque)

bind "MWHEELUP"                                "cl_radar_scale 0.5"      // Scroll up: sets radar scale to 0.5 (zoomed in)
bind "MWHEELDOWN"                              "cl_radar_scale 0.3"      // Scroll down: sets radar scale to 0.3 (default zoom)

// ============================================
// PERFORMANCE, GRAPHICS, & RAGDOLLS
// ============================================
fps_max                                        100                       // Maximum FPS in game (0 = unlimited)
fps_max_ui                                     60                        // Maximum FPS in menus / UI
engine_no_focus_sleep                          50                        // Milliseconds slept per frame while the game window is not focused (lowers CPU use)
r_drawtracers_firstperson                      0                         // Bullet tracers in first person (0 = hidden)
r_player_visibility_mode                       1                         // Player visibility enhancement mode (1 = on)
r_show_build_info                              0                         // Build information overlay (0 = hidden)

// ============================================
// NETWORK & TELEMETRY
// ============================================
rate                                           1000000                   // Maximum bytes per second the client sends / receives
cl_net_buffer_ticks                            0                         // Extra network buffer in ticks (0 = lowest latency)
cl_timeout                                     30                        // Seconds without server data before the client disconnects
cl_hud_telemetry_frametime_show                2                         // Frame-time / FPS telemetry panel (2 = always shown)
cl_hud_telemetry_ping_show                     2                         // Ping telemetry panel (2 = always shown)
cl_hud_telemetry_net_misdelivery_show          2                         // Packet loss / misdelivery telemetry panel (2 = always shown)

// ============================================
// AUDIO & COMMUNICATION
// ============================================
bind "MOUSE4"                                  "+voicerecord"            // Hold for push-to-talk voice chat

volume                                         1                         // Master volume (0-1)
voice_modenable                                1                         // Voice chat (1 = enabled)
voice_threshold                                0                         // Mic voice-activation threshold (0 = none)
cl_player_ping_mute                            0                         // Mute other players' pings (0 = not muted)
cl_mute_enemy_team                             0                         // Mutes voice chat of the enemy team (1 = on)
cl_mute_all_but_friends_and_party              0                         // Restrict voice to friends / party (0 = off, no restriction)
cl_show_clan_in_death_notice                   1                         // Shows clan tags in the kill feed (1 = on)
cl_sanitize_player_names                       0                         // Player-name sanitizing (cleaned-up display names): 0 = off

snd_deathcamera_volume                         0                         // Volume during the death camera replay (0 = muted)
snd_mapobjective_volume                        0                         // Volume of map objective sounds, e.g. bomb planted (0 = muted)
snd_menumusic_volume                           0                         // Main menu music volume (0 = muted)
snd_mvp_volume                                 0.1                       // MVP anthem volume (0.1 = 10%)
snd_roundend_volume                            0                         // Round-end music volume (0 = muted)
snd_roundstart_volume                          0                         // Round-start sound volume (0 = muted)
snd_tensecondwarning_volume                    0                         // Ten-second bomb warning volume (0 = muted)
snd_roundaction_volume                         0                         // Volume of other round-action music (0 = muted)
snd_mute_losefocus                             0                         // Mute audio when the window loses focus (0 = keep playing)
snd_mute_mvp_music_live_players                1                         // Mutes MVP music while players from both teams are still alive (1 = on)
snd_mixahead                                   0.001                     // Seconds of audio mixed ahead of playback (lower = lower latency)
snd_duckerattacktime                           0.5                       // Seconds the audio ducking takes to fade in
snd_duckerreleasetime                          2.5                       // Seconds the audio ducking takes to fade back out
snd_duckerthreshold                            0.15                      // Sound level above which ducking is triggered
snd_ducktovolume                               0.55                      // Volume scale ducked sounds are lowered to (0.55 = 55%)

// ============================================
// BUY & ECONOMY SETTINGS
// ============================================
bind "b"                                       "buymenu"                 // Open the buy menu
bind "F5"                                      "sellbackall"             // Sell back all purchasable equipment
// F3: buys, in this order (only items valid for your team and money are bought):
//   awp, deagle, vesthelm (kevlar + helmet), hegrenade, flashbang, smokegrenade,
//   molotov, incgrenade, defuser, taser
bind "F3"                                      "buy awp; buy deagle; buy vesthelm; buy hegrenade; buy flashbang; buy smokegrenade; buy molotov; buy incgrenade; buy defuser; buy taser;"

cl_use_opens_buy_menu                          false                     // Use key does not open the buy menu (false)
cl_buywheel_donate_key                         0                         // Key used to donate in the buy wheel (0 = none)
cl_buywheel_nonumberpurchasing                 0                         // Number-key purchasing in the buy wheel (0 = stays enabled)
cl_dm_buyrandomweapons                         0                         // Random weapon buying in Deathmatch (0 = off)

// ============================================
// RADIO & CHAT WHEEL COMMANDS
// ============================================
bind "u"                                       "messagemode2"            // Open team chat
bind "y"                                       "messagemode"             // Open all chat
bind "MOUSE3"                                  "player_ping"             // Ping the location you are looking at for teammates
bind "kp_2"                                    "radio"                   // Open the radio menu
bind "kp_4"                                    "radio1"                  // Open radio menu 1 (standard commands)
bind "kp_5"                                    "radio2"                  // Open radio menu 2 (group commands)
bind "kp_6"                                    "radio3"                  // Open radio menu 3 (report commands)
bind "kp_7"                                    "+radialradio"            // Hold to open radial radio menu 1
bind "kp_8"                                    "+radialradio2"           // Hold to open radial radio menu 2
bind "kp_9"                                    "+radialradio3"           // Hold to open radial radio menu 3

// Numpad Delete: sends the "Thanks" chat wheel message
bind "kp_del"                                  "playerchatwheel CW.Thanks #Chatwheel_thanks"
bind "uparrow"                                 "roger"                   // Up arrow: sends the "Roger that" radio command
bind "downarrow"                               "negative"                // Down arrow: sends the "Negative" radio command

// ============================================
// SYSTEM & MISCELLANEOUS BINDS
// ============================================
bind "`"                                       "toggleconsole"           // Toggle the developer console
bind "ESCAPE"                                  "cancelselect"            // Cancel the current selection
bind "F8"                                      "callvote starttimeout"   // Call a vote to start a timeout
bind "F9"                                      "vote option1"            // Vote option 1 (yes)
bind "F10"                                     "vote option2"            // Vote option 2 (no)
bind "F2"                                      "toggle volume 0 1"       // Toggle master volume between 0 (muted) and 1
bind "F1"                                      "toggle voice_modenable 0 1; echo Voice toggled" // Toggle voice chat on/off

cl_predict_body_shot_fx                        0                         // Local prediction of body-shot effects (0 = off)
cl_predict_head_shot_fx                        0                         // Local prediction of headshot effects (0 = off)
cl_predict_kill_ragdolls                       0                         // Local prediction of killed-enemy ragdolls (0 = off)

// ============================================
// SPECTATOR & OBSERVER SETTINGS
// ============================================
cl_obs_interp_enable                           1                         // Interpolation for smoother spectating (1 = on)
cl_observed_bot_crosshair                      0                         // Shows the crosshair of a spectated bot (0 = hidden)
spec_replay_autostart                          1                         // Automatically starts the replay when spectating begins (1 = on)
spec_show_xray                                 1                         // X-ray outlines of players while spectating (1 = on)
spec_usenumberkeys_nobinds                     0                         // Number keys select players while spectating: 0 = off (your own number-key binds are used)
cl_spec_show_bindings                          false                     // Spectator key-binding hints (false = hidden)


// ============================================
// MISCELLANEOUS CLIENT & CACHED SETTINGS
// ============================================
con_enable                                     1                         // Developer console (1 = enabled)
closecaption                                   0                         // Closed captions (0 = off)
trusted_launch                                 1                         // Trusted launch mode flag (1 = on)
cl_autohelp                                    0                         // Automatic help hints (0 = off)
cl_disable_round_end_report                    0                         // Round-end report (0 = NOT disabled, report is shown)
joystick                                       0                         // Joystick / controller support (0 = off)
cl_versus_intro                                false                     // Versus-screen intro sequence (false = skipped)
cl_scoreboard_mouse_enable_binding             +attack2                  // Input that frees the mouse on the scoreboard (hold secondary fire)
cl_scoreboard_survivors_always_on              1                         // Danger Zone survivors counter always shown on the scoreboard (1 = on)
cl_color                                       3                         // Preferred lobby player color (3 = blue)
// cl_clanid                                   "0"                       // REMOVED in the recent patch, throws Unknown command - no replacement found yet
cl_ping_fade_deadzone                          60                        // Distance at which pings start to fade
cl_ping_fade_distance                          300                       // Distance over which pings fade out
mapoverview_icon_scale                         1.0                       // Icon scale on the map overview
key_bind_version                               5                         // Key binding version number (compatibility)

mm_dedicated_search_maxping                    60                        // Maximum ping (ms) accepted when searching matchmaking servers
ui_steam_overlay_notification_position         bottomleft                // Steam overlay notification position on screen
ui_vanitysetting_team                          ct                        // Team shown in the main-menu vanity display
ui_vanitysetting_loadoutslot_ct                rifle4                    // Weapon slot shown for CT in the main-menu vanity display
ui_vanitysetting_loadoutslot_t                 rifle4                    // Weapon slot shown for T in the main-menu vanity display

// ============================================
// CS2PRAC SERVER PRACTICE (same logic as pracNihil, tuned for the local CS2Prac server)
// ============================================
// The CS2Prac server is a dedicated server: the client can't run server commands (sv_, mp_, bot_, ent_fire) on it,
// so each one goes through "css_cmd <command>" (you are admin there). Practice actions use MatchZy's own commands
// (the same as typing .bot / .clear / .rethrow in chat) instead of raw bot_add / ent_fire.
// pracNihil (offline, official Valve client) stays in Nihil.cfg.

// prac_server1 / 2a / 2b / 3: the server rules of pracNihil_cvars1-5 (same values)
alias "prac_server1"                           "css_cmd bot_quota_mode normal; css_cmd bot_difficulty 3; css_cmd custom_bot_difficulty 3; css_cmd bot_prefix [PRAC-BABY]; css_cmd bot_chatter off; css_cmd bot_stop 1; css_cmd mp_limitteams 0; css_cmd mp_autoteambalance 0"
alias "prac_server2a"                          "css_cmd mp_maxmoney 7355608; css_cmd mp_startmoney 65535; css_cmd mp_afterroundmoney 7355608; css_cmd mp_buytime 60000; css_cmd mp_buy_anywhere 1; css_cmd mp_freezetime 0"
alias "prac_server2b"                          "css_cmd mp_roundtime 0.01; css_cmd mp_roundtime_defuse 0.01; css_cmd mp_ignore_round_win_conditions 1; css_cmd mp_respawn_on_death_ct 1; css_cmd mp_respawn_on_death_t 1; css_cmd sv_infinite_ammo 1"
alias "prac_server3"                           "css_cmd ammo_grenade_limit_total 6; css_cmd sv_grenade_trajectory_prac_pipreview 0; css_cmd sv_grenade_trajectory_prac_trailtime 8; css_cmd sv_showimpacts 0; css_cmd sv_regeneration_force_on 1; css_cmd sv_showbullethits 1; css_cmd mp_team_intro_time 0"
// prac_client: the client-side lines of pracNihil_cvars1 (these the client runs itself)
alias "prac_client"                            "cl_disable_ragdolls 1; r_drawworld 1; r_csgo_render_decals 0; r_drawdecals 0"
// prac_server: everything above, then MatchZy's .nobots (pracNihil did bot_kick) and a restart after 1 second.
//   sv_cheats and mp_warmup_end are left out: the CS2Prac server already runs with sv_cheats 1 and MatchZy's
//   practice mode has no warmup. Run it (or press F6) once you are connected.
alias "prac_server"                            "prac_server1; prac_server2a; prac_server2b; prac_server3; css_nobots; css_cmd mp_restartgame 1"

// Key actions (pracNihil's local_* actions, server versions)
// prac_bot: MatchZy's .bot puts a bot where you stand (bot_add_t made two on this server: MatchZy kicks bots it
// didn't add and bot_quota fills the slot again)
alias "prac_bot"                               "css_bot; play sounds/buttons/blip1.vsnd"
// prac_boost / prac_crouch: bots stand up / crouch (bot_crouch, as in pracNihil). MatchZy's own variants:
// .crouchbot (css_crouchbot) adds a crouching bot, .boost (css_boost) adds a bot under you to stand on.
alias "prac_boost"                             "css_cmd bot_crouch 0; play sounds/buttons/blip2.vsnd"
alias "prac_crouch"                            "css_cmd bot_crouch 1; play sounds/buttons/button9.vsnd"
// prac_nobots: MatchZy's .nobots (it also forgets its tracked bots, raw bot_kick leaves it confused)
alias "prac_nobots"                            "css_nobots; play sounds/ui/lobby_notification_kicked.vsnd"
// prac_rethrow: MatchZy's .rethrow (your own last grenade; sv_rethrow_last_grenade threw the server's last one)
alias "prac_rethrow"                           "css_rethrow"
// prac_clear: MatchZy's .clear removes all smokes and fires; the ent_fire lines catch flashes, HEs and decoys too
alias "prac_clear"                             "css_clear; css_cmd ent_fire flashbang_projectile kill; css_cmd ent_fire hegrenade_projectile kill; css_cmd ent_fire decoy_projectile kill; stopsound; play sounds/ui/item_drop.vsnd"

// Infinite ammo: practice starts at 1 (no reload); Page Up cycles 2 (reload available) -> OFF -> 1
alias "prac_infAmmo1"                          "css_cmd sv_infinite_ammo 1; say Infinite ammo: 1 (no reload); alias infAmmoToggle prac_infAmmo2"
alias "prac_infAmmo2"                          "css_cmd sv_infinite_ammo 2; say Infinite ammo: 2 (reload available); alias infAmmoToggle prac_infAmmoOff"
alias "prac_infAmmoOff"                        "css_cmd sv_infinite_ammo 0; say Infinite ammo: OFF; alias infAmmoToggle prac_infAmmo1"
alias "infAmmoToggle"                          "prac_infAmmo2"

// Console commands "bullet" and "nade": bullet impacts / grenade trajectory preview toggles (start with ON)
alias "prac_bulletOn"                          "css_cmd sv_showimpacts 1; echo Bullet impacts ON; alias bullet prac_bulletOff"
alias "prac_bulletOff"                         "css_cmd sv_showimpacts 0; echo Bullet impacts OFF; alias bullet prac_bulletOn"
alias "bullet"                                 "prac_bulletOn"
alias "prac_nadeOn"                            "css_cmd sv_grenade_trajectory_prac_pipreview 1; echo Nade preview ON; alias nade prac_nadeOff"
alias "prac_nadeOff"                           "css_cmd sv_grenade_trajectory_prac_pipreview 0; echo Nade preview OFF; alias nade prac_nadeOn"
alias "nade"                                   "prac_nadeOn"

// God mode (console command "lana"): MatchZy's .god for you only, with the same sounds as in Nihil.cfg
alias "godToggle_on"                           "css_god; play sounds/ui/armsrace_level_up.vsnd; echo --- GOD MODE: ENABLED ---; alias lana godToggle_off"
alias "godToggle_off"                          "css_god; play sounds/ui/deathmatch_first_blood.vsnd; echo --- GOD MODE: DISABLED ---; alias lana godToggle_on"
alias "lana"                                   "godToggle_on"

// M: switch sides at once (no team menu). css_side (PracSkins) reads your real team, switches, respawns you and puts
// you back where you stood (also .side in chat). prac_side stays as a name for it.
alias "prac_side"                              "css_side"
// .bs / E: back to your spawn (the last spawn marker or .spawn you went to, else where you spawned). E only does it
// when nothing usable is in front of you (setting "E = back to spawn" in L). Bind another key to prac_backspawn if you like.
alias "prac_backspawn"                         "css_backspawn"

// P: third person toggle (needs sv_cheats 1, which the server has; untested in CS2, see the plan)
alias "prac_tp_on"                             "thirdperson; alias prac_tp prac_tp_off"
alias "prac_tp_off"                            "firstperson; alias prac_tp prac_tp_on"
alias "prac_tp"                                "prac_tp_on"

// K/L windows and the HUD: telemetry + radar off while a window is open (cl_drawhud 0 would hide the window too).
//   The client ignores HUD cvars/aliases the server sends, so these keys do it themselves and keep track of which
//   window is open (none / k / l). They tell the server "open" or "close" (css_menu open|close, css_pracmenu
//   open|close), so the window and the HUD stay in step. Tab closes the windows on the server, so +cs2prac_tab
//   brings the HUD back with it. Closing with the window's X leaves the HUD off until the next K/L press.
alias "cs2prac_hud_off"                        "cl_hud_telemetry_frametime_show 0; cl_hud_telemetry_ping_show 0; cl_hud_telemetry_net_misdelivery_show 0; cl_drawhud_force_radar -1"
alias "cs2prac_hud_on"                         "cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2; cl_drawhud_force_radar 0"
alias "cs2prac_state_none"                     "alias cs2prac_k cs2prac_k_open; alias cs2prac_l cs2prac_l_open"
alias "cs2prac_state_k"                        "alias cs2prac_k cs2prac_k_close; alias cs2prac_l cs2prac_l_from_k"
alias "cs2prac_state_l"                        "alias cs2prac_l cs2prac_l_close; alias cs2prac_k cs2prac_k_from_l"
alias "cs2prac_k_open"                         "cs2prac_hud_off; css_menu open; cs2prac_state_k"
alias "cs2prac_k_close"                        "cs2prac_hud_on; css_menu close; cs2prac_state_none"
alias "cs2prac_k_from_l"                       "css_menu open; cs2prac_state_k"
alias "cs2prac_l_open"                         "cs2prac_hud_off; css_pracmenu open; cs2prac_state_l"
alias "cs2prac_l_close"                        "cs2prac_hud_on; css_pracmenu close; cs2prac_state_none"
alias "cs2prac_l_from_k"                       "css_pracmenu open; cs2prac_state_l"
alias "+cs2prac_tab"                           "+showscores; cs2prac_hud_on; cs2prac_state_none"
alias "-cs2prac_tab"                           "-showscores"
// T: tap = spray the picked graffiti; hold = CS2Prac graffiti wheel, release sprays
alias "+cs2prac_spray"                         "css_spraywheel open"
alias "-cs2prac_spray"                         "css_spraywheel close"
cs2prac_state_none

// Practice binds: the same keys as pracNihil_binds, plus K / L / Tab / T / M / P / F6
bind "kp_plus"                                 "prac_bot"                // Numpad +: MatchZy bot where you stand (.bot)
bind "home"                                    "prac_boost"              // Home: bots stand up
bind "end"                                     "prac_crouch"             // End: bots crouch
bind "kp_minus"                                "prac_nobots"             // Numpad -: remove all bots (.nobots)
bind "pgup"                                    "infAmmoToggle"           // Page Up: cycle infinite-ammo modes
bind "ins"                                     "prac_rethrow"            // Insert: re-throw your last grenade (.rethrow)
bind "del"                                     "prac_clear"              // Delete: clear all utility (.clear)
bind "n"                                       "noclip"                  // N: toggle noclip
bind "k"                                       "cs2prac_k"               // K: CS2Prac skin window
bind "l"                                       "cs2prac_l"               // L: CS2Prac server settings window
bind "TAB"                                     "+cs2prac_tab"            // Tab: scoreboard, and the HUD comes back if a window was open
bind "t"                                       "+cs2prac_spray"          // T: spray / graffiti wheel
bind "m"                                       "prac_side"               // M: switch sides at once (no team menu)
bind "p"                                       "prac_tp"                 // P: third person on/off
bind "F6"                                      "prac_server"             // F6: (re)apply the practice server rules

// Keys picked in the app (Play page > Keys): the app writes cs2prac_keys.cfg next to this file
exec cs2prac_keys

// Applies the practice setup right away (when you exec this while connected; otherwise press F6 after connecting)
prac_client
prac_server

