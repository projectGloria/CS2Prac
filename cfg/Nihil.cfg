// ============================================
// ENHANCED GOD MODE TOGGLE (LANA)
// ============================================
// godToggle_on: turns god mode on and arms the OFF version:
//   god                                       - toggles god mode (needs sv_cheats 1)
//   play sounds/ui/armsrace_level_up.vsnd     - plays the "enabled" sound
