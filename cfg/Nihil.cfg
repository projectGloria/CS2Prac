//   play sounds/ui/deathmatch_first_blood.vsnd - plays the "disabled" sound
//   echo --- GOD MODE: DISABLED ---            - prints the status in the console
//   alias lana godToggle_on                   - next "lana" runs godToggle_on
alias "godToggle_off"                          "god; play sounds/ui/deathmatch_first_blood.vsnd; echo --- GOD MODE: DISABLED ---; alias lana godToggle_on"
alias "lana"                                   "godToggle_on"            // Console command "lana": toggles god mode (starts with godToggle_on)


// ============================================
// LOCAL PRACTICE ENVIRONMENT (pracNihil)
// ============================================
// pracNihil_cvars1: cheats, bots and general server rules:
//   sv_cheats 1               - enables cheat commands
//   cl_disable_ragdolls 1     - disables ragdolls
//   r_drawworld 1             - renders world geometry (1 = on)
//   r_csgo_render_decals 0    - disables decal rendering
//   r_drawdecals 0            - hides decals (bullet holes, blood)
//   bot_quota_mode normal     - bot quota mode "normal"
//   bot_quota 0               - no automatically added bots
//   bot_difficulty 3          - bot skill 3 (expert)
//   custom_bot_difficulty 3   - custom bot skill 3 (expert)
//   bot_prefix [PRAC-BABY]    - name prefix for bots (quotes/space removed: nested quotes inside an alias are unreliable)
//   bot_chatter off           - bots stay silent on the radio
//   bot_kick                  - removes all bots
//   bot_stop 1                - bots stand still and do not shoot
//   mp_limitteams 0           - no team-size imbalance limit
//   mp_autoteambalance 0      - no automatic team balancing
//   mp_maxmoney 7355608       - maximum money a player can hold
//   mp_startmoney 65535       - starting money
alias "pracNihil_cvars1"                       "sv_cheats 1; cl_disable_ragdolls 1; r_drawworld 1; r_csgo_render_decals 0; r_drawdecals 0; bot_quota_mode normal; bot_quota 0; bot_difficulty 3; custom_bot_difficulty 3; bot_prefix [PRAC-BABY]; bot_chatter off; bot_kick; bot_stop 1; mp_limitteams 0; mp_autoteambalance 0; mp_maxmoney 7355608; mp_startmoney 65535"
// pracNihil_cvars2: economy and round rules:
//   mp_afterroundmoney 7355608          - money given to every player after each round
//   mp_buytime 60000                    - seconds players can buy after the round starts
//   mp_buy_anywhere 1                   - buy anywhere on the map
//   mp_roundtime 0.01                   - round length in minutes
//   mp_roundtime_defuse 0.01            - round length in minutes on defuse maps
//   mp_freezetime 0                     - no freeze time at round start
//   mp_ignore_round_win_conditions 1    - rounds do not end on win conditions
alias "pracNihil_cvars2"                       "mp_afterroundmoney 7355608; mp_buytime 60000; mp_buy_anywhere 1; mp_roundtime 0.01; mp_roundtime_defuse 0.01; mp_freezetime 0; mp_ignore_round_win_conditions 1"
// pracNihil_cvars3: respawns and ammo:
//   mp_ignore_round_win_conditions 1    - rounds do not end on win conditions (repeated from cvars2)
//   mp_respawn_on_death_ct 1            - CT players respawn after dying
//   mp_respawn_on_death_t 1             - T players respawn after dying
//   mp_warmup_end                       - ends the warmup phase
//   sv_infinite_ammo 1                  - infinite ammo without reloading
alias "pracNihil_cvars3"                       "mp_ignore_round_win_conditions 1; mp_respawn_on_death_ct 1; mp_respawn_on_death_t 1; mp_warmup_end; sv_infinite_ammo 1"
// pracNihil_cvars4: grenades and bullet impacts:
//   ammo_grenade_limit_total 6                 - maximum grenades carried in total
//   sv_grenade_trajectory_prac_pipreview 0     - grenade trajectory preview off
//   sv_grenade_trajectory_prac_trailtime 8     - seconds the grenade trajectory trail stays visible
//   sv_showimpacts 0                           - bullet impact markers off
alias "pracNihil_cvars4"                       "ammo_grenade_limit_total 6; sv_grenade_trajectory_prac_pipreview 0; sv_grenade_trajectory_prac_trailtime 8; sv_showimpacts 0"
// pracNihil_cvars5: health, hit info and intro:
//   sv_regeneration_force_on 1   - forces health regeneration on
//   sv_showbullethits 1          - shows bullet hit visualization
//   mp_team_intro_time 0         - no team intro
alias "pracNihil_cvars5"                       "sv_regeneration_force_on 1; sv_showbullethits 1; mp_team_intro_time 0"
// pracNihil_cvars: runs pracNihil_cvars1 to pracNihil_cvars5, then:
//   mp_restartgame 1   - restarts the game after 1 second
alias "pracNihil_cvars"                        "pracNihil_cvars1; pracNihil_cvars2; pracNihil_cvars3; pracNihil_cvars4; pracNihil_cvars5; mp_restartgame 1"

