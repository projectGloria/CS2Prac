// local_clear: removes all active utility and stops sounds:
//   ent_fire smokegrenade_projectile kill   - removes smoke grenades
//   ent_fire molotov_projectile kill        - removes molotovs
//   ent_fire inferno kill                   - removes fire from molotovs / incendiaries
//   ent_fire flashbang_projectile kill      - removes flashbangs
//   ent_fire hegrenade_projectile kill      - removes HE grenades
//   ent_fire decoy_projectile kill          - removes decoys
//   stopsound                               - stops all playing sounds
//   play sounds/ui/item_drop.vsnd           - confirmation sound
alias "local_clear"                            "ent_fire smokegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire inferno kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; ent_fire decoy_projectile kill; stopsound; play sounds/ui/item_drop.vsnd"

// Local practice starts at 1 (infinite ammo without reloading).
// Page Up cycles: 2 (reload available) -> 0 (off) -> 1 (no reload)
// infAmmo1:
//   sv_infinite_ammo 1                      - infinite ammo, no reload needed
//   say Infinite ammo: 1 (no reload)        - sends this text to chat
//   alias infAmmoToggle infAmmo2            - next toggle goes to mode 2
alias "infAmmo1"                               "sv_infinite_ammo 1; say Infinite ammo: 1 (no reload); alias infAmmoToggle infAmmo2"
// infAmmo2:
//   sv_infinite_ammo 2                      - infinite ammo, reloading still possible
//   say Infinite ammo: 2 (reload available) - sends this text to chat
//   alias infAmmoToggle infAmmoOff          - next toggle goes to OFF
alias "infAmmo2"                               "sv_infinite_ammo 2; say Infinite ammo: 2 (reload available); alias infAmmoToggle infAmmoOff"
// infAmmoOff:
//   sv_infinite_ammo 0                      - infinite ammo off
//   say Infinite ammo: OFF                  - sends this text to chat
//   alias infAmmoToggle infAmmo1            - next toggle goes back to mode 1
alias "infAmmoOff"                             "sv_infinite_ammo 0; say Infinite ammo: OFF; alias infAmmoToggle infAmmo1"
alias "infAmmoToggle"                          "infAmmo2"                // Toggle entry point: starts with infAmmo2, then cycles 2 -> OFF -> 1

// pracNihil_binds: practice key binds:
//   bind kp_plus local_bot       - Numpad +: add a T bot
//   bind home local_boost        - Home: bots stand up
//   bind kp_minus local_nobots   - Numpad -: remove all bots
//   bind pgup infAmmoToggle      - Page Up: cycle infinite-ammo modes
//   bind ins local_rethrow       - Insert: re-throw last grenade
//   bind del local_clear         - Delete: clear all utility
//   bind end local_crouch        - End: bots crouch
//   bind N noclip                - N: toggle noclip (fly through walls)
alias "pracNihil_binds"                        "bind kp_plus local_bot; bind home local_boost; bind kp_minus local_nobots; bind pgup infAmmoToggle; bind ins local_rethrow; bind del local_clear; bind end local_crouch; bind N noclip"

// Master Trigger
// pracNihil: master command that loads the whole local practice setup:
//   pracNihil_cvars                  - applies all practice cvars (see above)
//   pracNihil_binds                  - applies all practice binds (see above)
//   alias infAmmoToggle infAmmo2     - resets the ammo toggle to start at mode 2
//   alias bullet bulletOn            - resets the bullet-impact toggle to ON
//   alias nade nadeOn                - resets the nade-preview toggle to ON
//   echo --- LOCAL PRACTICE: LOADED ---    - prints the status in the console
//   play sounds/ui/csgo_ui_contract_type2.vsnd - confirmation sound
alias "pracNihil"                              "pracNihil_cvars; pracNihil_binds; alias infAmmoToggle infAmmo2; alias bullet bulletOn; alias nade nadeOn; echo --- LOCAL PRACTICE: LOADED ---; play sounds/ui/csgo_ui_contract_type2.vsnd"

// Local Impact/Nade Toggles
// bulletOn:
//   sv_showimpacts 1                 - shows bullet impacts
//   echo Bullet impacts ON           - prints the status in the console
//   alias bullet bulletOff           - next "bullet" turns it off
alias "bulletOn"                               "sv_showimpacts 1; echo Bullet impacts ON; alias bullet bulletOff"
// bulletOff:
//   sv_showimpacts 0                 - hides bullet impacts
//   echo Bullet impacts OFF          - prints the status in the console
//   alias bullet bulletOn            - next "bullet" turns it on
alias "bulletOff"                              "sv_showimpacts 0; echo Bullet impacts OFF; alias bullet bulletOn"
alias "bullet"                                 "bulletOn"                // Console command "bullet": toggles bullet impacts (starts with bulletOn)
// nadeOn:
//   sv_grenade_trajectory_prac_pipreview 1  - shows the grenade trajectory preview
//   echo Nade preview ON                    - prints the status in the console
//   alias nade nadeOff                      - next "nade" turns it off
alias "nadeOn"                                 "sv_grenade_trajectory_prac_pipreview 1; echo Nade preview ON; alias nade nadeOff"
// nadeOff:
//   sv_grenade_trajectory_prac_pipreview 0  - hides the grenade trajectory preview
//   echo Nade preview OFF                   - prints the status in the console
//   alias nade nadeOn                       - next "nade" turns it on
alias "nadeOff"                                "sv_grenade_trajectory_prac_pipreview 0; echo Nade preview OFF; alias nade nadeOn"
alias "nade"                                   "nadeOn"                  // Console command "nade": toggles the grenade trajectory preview (starts with nadeOn)


