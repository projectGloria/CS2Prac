# Builds the Windows installer and publishes it as a GitHub Release.
# Trigger: push a tag like v0.2.0 (must match "version" in package.json).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:plugin

      # electron-builder uploads its files in parallel and each upload creates the release if none exists, which
      # made two drafts for v1.0.0. Creating the draft once here (with the notes from docs/release-notes/<tag>)
      # gives them one release to upload into.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-body.md
          gh release create "$GITHUB_REF_NAME" --draft --title "CS2Prac ${GITHUB_REF_NAME#v}" --notes-file release-body.md

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
