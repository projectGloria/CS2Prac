# Builds the item site (npm run build:site: scripts/site, fresh ByMykel data) and deploys it to GitHub Pages.
# Runs on pushes to main that touch the site or the shared item code, weekly (new skins) and by hand.
name: Pages

on:
  push:
    branches: [main]
    paths: ['scripts/site/**', 'src/shared/**', 'src/main/skins/catalog.ts', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
