<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'" />
    <title>CS2Prac</title>
    <style>
      /* Splash markup; splash.ts sets the art (a relative src here broke in dev) and App.tsx removes it when ready. */
      html, body { margin: 0; background: #0e1014; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; background: #0e1014; color: #8a93a3; font: 13px 'Segoe UI', system-ui, sans-serif; -webkit-app-region: drag;
        transition: opacity 0.35s ease;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash img { width: min(280px, 40vh); height: min(280px, 40vh); border-radius: 18px; box-shadow: 0 18px 60px rgba(255, 110, 80, 0.18); }
      .spinner {
        width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #e8a33d;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img id="splash-img" alt="" />
      <div class="spinner"></div>
      <span id="splash-text">Loading…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
